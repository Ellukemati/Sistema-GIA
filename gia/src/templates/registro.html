<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIA - Registro</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 8px; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Registro de Usuario Institucional</h2>
    
    <form hx-post="/registro" hx-target="#resultado">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="apellido" placeholder="Apellido" required>
        <input type="email" name="email" placeholder="Email (@fi.uba.ar)" required>
        <input type="number" name="legajo" placeholder="Legajo" required>
        <select name="tipo">
            <option value="S">Alumno</option>
            <option value="P">Profesor</option>
        </select>
        <input type="password" name="password" placeholder="Contraseña" required>
        
        <button type="submit">Registrarse</button>
    </form>

    <div id="resultado"></div>
</body>
</html>
