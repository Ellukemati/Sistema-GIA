<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva</title>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>

<form
    hx-post="/reservas/nueva"
    hx-target="#resultado">

    <input
        type="number"
        name="usuario_id"
        placeholder="ID Usuario"
        required>

    <input
        type="number"
        name="ejemplar_id"
        placeholder="ID Ejemplar"
        required>

    <input
        type="date"
        name="fecha_inicio"
        required>

    <input
        type="date"
        name="fecha_fin"
        required>

    <input
        type="text"
        name="motivo"
        placeholder="Motivo">

    <button type="submit">
        Crear reserva
    </button>

</form>

<div id="resultado"></div>

</body>
</html>
