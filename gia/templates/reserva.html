<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva</title>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        #resultado { margin-top: 1rem; }
        #resultado .mensaje {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1.5px solid transparent;
        }
        #resultado .mensaje strong { display: block; margin-bottom: 0.5rem; font-size: 0.95rem; }
        #resultado .mensaje p { margin: 0; }
        #resultado .mensaje--exito { color: #15803d; background-color: #e8f7ee; border-color: #86c9a0; }
        #resultado .mensaje--error { color: #b91c1c; background-color: #fdeeed; border-color: #e8a0a0; }
    </style>
</head>

<body>

<form
    hx-post="/reservas/nueva"
    hx-target="#resultado">

    <input
        type="number"
        name="id_usuario"
        placeholder="ID Usuario"
        required>

    <input
        type="number"
        name="ejemplar_id"
        placeholder="ID Ejemplar"
        required>

    <input
        type="date"
        name="fecha_inicio"
        required>

    <input
        type="date"
        name="fecha_fin"
        required>

    <input
        type="text"
        name="motivo"
        placeholder="Motivo">

    <button type="submit">
        Crear reserva
    </button>

</form>

<div id="resultado"></div>

</body>
</html>
