<style>
    :root {
        --color-primary: #0091D5;
        --color-primary-hover: #007bb5;
        --color-accent: #F58220;
        --color-accent-hover: #d96f15;
        --color-bg: #f0f6fa;
        --color-surface: #ffffff;
        --color-text: #1a1a1a;
        --color-muted: #5a6a75;
        --color-border: #c5d9e8;
        --color-focus-ring: rgba(0, 145, 213, 0.2);
        --color-error: #b91c1c;
        --color-success: #15803d;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-card: 0 8px 24px rgba(0, 145, 213, 0.1);
        --spacing-xs: 0.5rem;
        --spacing-sm: 0.75rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        line-height: 1.5;
    }

    .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-md);
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background-color: var(--color-surface);
        border: 2px solid var(--color-primary);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: var(--spacing-lg);
    }

    .auth-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
    }

    .auth-brand {
        margin: 0 0 var(--spacing-md);
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .auth-logo {
        max-width: 200px;
        width: 100%;
        height: auto;
        object-fit: contain;
    }

    .auth-header h1 {
        margin: 0 0 var(--spacing-xs);
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--color-text);
    }

    .auth-subtitle {
        margin: 0;
        font-size: 0.9rem;
        color: var(--color-muted);
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
    }

    .field-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-md);
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
    }

    .field label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text);
    }

    .field input,
    .field select,
    .field textarea {
        width: 100%;
        padding: 0.65rem 0.75rem;
        font-size: 1rem;
        color: var(--color-text);
        background-color: var(--color-surface);
        border: 1.5px solid var(--color-border);
        border-radius: var(--radius-sm);
        box-sizing: border-box;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input,
    .field select {
        min-height: 44px;
    }

    .field textarea {
        min-height: 5rem;
        resize: vertical;
        font-family: inherit;
        line-height: 1.4;
    }

    .field input::placeholder,
    .field textarea::placeholder {
        color: #9aa8b2;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--color-focus-ring);
    }

    .field-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text);
    }

    .accesorios-radio {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .radio-group {
        display: flex;
        gap: var(--spacing-md);
    }

    .radio-label {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-xs);
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--color-text);
        cursor: pointer;
        padding: 0.5rem 1rem;
        border: 1.5px solid var(--color-border);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    #accesorios_no:checked ~ .radio-group .radio-label[for="accesorios_no"],
    #accesorios_si:checked ~ .radio-group .radio-label[for="accesorios_si"] {
        border-color: var(--color-primary);
        background-color: rgba(0, 145, 213, 0.08);
        font-weight: 600;
    }

    .accesorios-detalle {
        display: none;
        flex-direction: column;
        gap: var(--spacing-xs);
    }

    #accesorios_si:checked ~ .accesorios-detalle {
        display: flex;
    }

    .field-hint {
        font-size: 0.8rem;
        color: var(--color-muted);
    }

    .btn-primary {
        margin-top: var(--spacing-sm);
        width: 100%;
        min-height: 44px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        font-weight: 700;
        color: var(--color-surface);
        background-color: var(--color-accent);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
        background-color: var(--color-accent-hover);
    }

    .btn-primary:active {
        transform: scale(0.98);
    }

    .btn-primary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.35);
    }

    .btn-secondary {
        width: 100%;
        min-height: 44px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--color-primary);
        background-color: var(--color-surface);
        border: 1.5px solid var(--color-primary);
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-secondary:hover {
        background-color: var(--color-primary);
        color: var(--color-surface);
    }

    .btn-secondary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--color-focus-ring);
    }

    #modelo-select-container {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
    }

    .field-hint--error {
        color: var(--color-error);
    }

    .field-hint a {
        color: var(--color-primary);
        font-weight: 600;
        text-decoration: none;
    }

    .field-hint a:hover {
        text-decoration: underline;
    }

    .auth-footer {
        margin-top: var(--spacing-lg);
        text-align: center;
    }

    .auth-footer p {
        margin: 0;
        font-size: 0.9rem;
        color: var(--color-muted);
    }

    .auth-footer a {
        color: var(--color-primary);
        font-weight: 600;
        text-decoration: none;
    }

    .auth-footer a:hover {
        text-decoration: underline;
        color: var(--color-primary-hover);
    }

    /* SOPORTE PARA OJITO (VISIBILIDAD DE CONTRASEÑA OPCIONAL) */
    .password-wrapper {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
    }
    
    .toggle-password {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        color: var(--color-muted);
        cursor: pointer;
        padding: var(--spacing-xs);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
    }

    .toggle-password:hover {
        color: var(--color-primary);
    }

    .password-wrapper input {
        padding-right: 2.75rem !important;
    }

    @media (min-width: 480px) {
        .auth-page {
            padding: var(--spacing-lg);
        }

        .auth-card {
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
        }

        .field-row {
            grid-template-columns: 1fr 1fr;
        }

        .field input,
        .field select {
            min-height: auto;
            font-size: 0.95rem;
        }
    }

    @media (max-width: 479px) {
        .auth-header {
            margin-bottom: var(--spacing-lg);
        }

        .auth-brand {
            font-size: 1.75rem;
        }

        .auth-header h1 {
            font-size: 1.2rem;
        }

        .auth-subtitle {
            font-size: 0.85rem;
        }
    }
</style>
