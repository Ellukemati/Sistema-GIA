<!DOCTYPE html>
<html lang="es">
<head>
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GIA{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script>    // Manejar errores HTTP en htmx
        document.addEventListener('htmx:beforeOnLoad', function (evt) {
            if (evt.detail.xhr.status >= 400) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false; 
            }
        });
    </script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#007bff">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
                    .then(registration => {
                        console.log('Service Worker registrado correctamente con alcance:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Fallo al registrar el Service Worker:', error);
                    });
            });
        }
    </script>
    <style>
        body {
            background-image: url('../static/img/fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            color: #6c757d;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .btn-volver:hover {
            color: #007bff;
        }

    </style>
    {% block extra_head %}{% endblock %}
    {% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
