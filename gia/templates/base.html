<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GIA{% endblock %}</title>
    
    <link rel="icon" type="image/png" href="/{{ logo_path }}">
    
    <!-- Enlace a CSS global -->
    <link rel="stylesheet" href="/static/css/base.css">

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <script>
        document.addEventListener('htmx:beforeOnLoad', function (evt) {
            if (evt.detail.xhr.status >= 400) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false; 
            }
        });
    </script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#007bff">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
                    .then(registration => {
                        console.log('Service Worker registrado correctamente con alcance:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Fallo al registrar el Service Worker:', error);
                    });
            });
        }
    </script>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
