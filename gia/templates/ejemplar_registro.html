<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIA - Registro</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 8px; }
    </style>
    <style>
        #resultado { margin-top: 1rem; }
        #resultado .mensaje {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1.5px solid transparent;
        }
        #resultado .mensaje strong { display: block; margin-bottom: 0.5rem; font-size: 0.95rem; }
        #resultado .mensaje p { margin: 0; }
        #resultado .mensaje--exito { color: #15803d; background-color: #e8f7ee; border-color: #86c9a0; }
        #resultado .mensaje--error { color: #b91c1c; background-color: #fdeeed; border-color: #e8a0a0; }
    </style>
</head>
<body>
    <h2>Registro de ejemplar</h2>

    <form hx-post="/ejemplar/registro" hx-target="#resultado">
        <select name="modelo_id" required>
            <option value="" disabled selected>Seleccione un modelo</option>
            {{opciones_modelos}}
        </select>
        <input type="text" name="numero_serie" placeholder="Numero de serie">
        <input type="text" name="codigo_qr" placeholder="Codigo QR">
        <input type="text" name="patrimonio" placeholder="Patrimonio">
        <input type="text" name="observaciones" placeholder="Observaciones">
        <input type="text" name="ubicacion" placeholder="Ubicacion">
        <select name="esta_disponible">
            <option value="true" selected>Disponible</option>
            <option value="false">No disponible</option>
        </select>
        <button type="submit">Registrar ejemplar</button>
    </form>

    <div id="resultado"></div>
</body>
</html>
