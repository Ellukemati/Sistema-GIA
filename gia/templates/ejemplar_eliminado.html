{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/auth.css">
<link rel="stylesheet" href="/static/css/mensajes.css">
{% endblock %}

{% block extra_head %}
<style>
    .resultado-page .auth-header {
        margin-bottom: var(--spacing-lg);
    }

    .resultado-acciones {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        margin-top: var(--spacing-xl);
    }

    .resultado-acciones a {
        display: block;
        text-align: center;
        box-sizing: border-box;
        text-decoration: none;
        line-height: 1.2;
    }

    .resultado-acciones .btn-primary {
        margin-top: 0;
    }
</style>
{% endblock %}

{% block content %}
<main class="auth-page resultado-page">
    <section class="auth-card">

        <div class="mensaje {% if exito %}mensaje--exito{% else %}mensaje--error{% endif %}">
            <p>{{ mensaje }}</p>
        </div>

        <div class="resultado-acciones">
            <a href="/modelo" class="btn-primary">Volver al catálogo</a>
        </div>
    </section>
</main>
{% endblock %}
