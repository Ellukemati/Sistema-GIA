<div class="field">
    <label for="password">{{ password_label | default(value="Contraseña") }}</label>
    <div class="password-wrapper">
        <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="{{ password_autocomplete | default(value="new-password") }}"
        >
        <button type="button" id="btn-toggle" class="toggle-password" title="Mostrar/Ocultar contraseña">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>
    {% if mostrar_recuperar | default(value=false) %}
    <p class="field-hint" style="text-align: right; margin-top: 1px;">
        <a href="/restablecer">Olvidé mi contraseña</a>
    </p>
    {% endif %}
</div>
