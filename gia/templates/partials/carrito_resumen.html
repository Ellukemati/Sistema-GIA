<section id="carrito-resumen" class="carrito-resumen"{% if oob %} hx-swap-oob="true"{% endif %}>
    <div class="carrito-resumen-info">
        <span class="carrito-resumen-cantidad">{{ carrito_cantidad }}</span>
        <span class="carrito-resumen-texto">ejemplar(es) en esta reserva</span>
    </div>
    <form method="POST" action="/reservas/finalizar" class="carrito-resumen-form">
        <div class="carrito-motivo-field">
            <label for="carrito-motivo-input" class="carrito-motivo-label">Motivo</label>
            <input
                type="text"
                id="carrito-motivo-input"
                name="motivo"
                class="carrito-motivo"
                placeholder="Ej.: práctica de campo"
                required
                minlength="1"
                maxlength="500"
            >
        </div>
        <a class="btn-ver-detalle" href="/reservas/carrito">Ver detalle</a>
        <button type="submit" class="btn-finalizar"{% if carrito_cantidad == 0 %} disabled{% endif %}>
            Finalizar reserva
        </button>
    </form>
</section>
