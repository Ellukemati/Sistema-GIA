{% if grupos | length == 0 %}
<p class="catalogo-vacio">No hay modelos con ejemplares disponibles para esas fechas.</p>
{% else %}
    {% for grupo in grupos %}
    <section class="categoria-seccion">
        <h2 class="categoria-titulo">{{ grupo.categoria }}</h2>
        <div class="cards-grid">
            {% for m in grupo.modelos %}
            <a class="modelo-card" href="/reservas/modelo/{{ m.id }}">
                <div class="modelo-card-media">
                    {% if m.imagen %}
                    <img class="modelo-card-img" src="{{ m.imagen }}" alt="{{ m.nombre_modelo }}" loading="lazy">
                    {% else %}
                    <div class="modelo-card-sin-imagen">Sin imagen</div>
                    {% endif %}
                </div>
                <p class="modelo-card-nombre">{{ m.nombre_modelo }}</p>
            </a>
            {% endfor %}
        </div>
    </section>
    {% endfor %}
{% endif %}
