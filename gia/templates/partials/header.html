<nav class="main-navbar">

    <div class="nav-left-zone">
        {% if usuario_actual and not en_perfil %}
        <a href="/perfil" class="profile-action-card" title="Editar mi perfil">
            <div class="avatar-container">
                <img src="/imagenes/avatares/{{ usuario_actual.legajo }}?v={{ avatar_cache_buster | default(value=0) }}"
                    alt="Avatar" class="profile-avatar"
                    onerror="this.onerror=null; this.src='/static/img/avatardefault.avif';">
                <span class="badge-edit-gear">⚙️</span>
            </div>
            <div class="profile-info-text">
                <span class="profile-welcome">Hola, <strong>{{ usuario_actual.nombre }}</strong></span>
                <span class="profile-role">{% if usuario_actual.tipo == "A" %}Administrador{% else %}Docente{% endif
                    %}</span>
            </div>
        </a>
        {% elif not usuario_actual %}
        <a href="/ingreso" class="btn-volver">
            Iniciar sesión
        </a>
        {% endif %}

        {% if usuario_actual and not en_home %}
        <a href="/inicio" class="btn-volver btn-inicio-nav">
            <span class="texto-largo-inicio">Ir al Inicio</span>
            <span class="texto-corto-inicio" style="display: none;">Inicio</span>
        </a>
        {% endif %}
    </div>

    <div class="nav-brand">
        <a href="{% if usuario_actual %}/inicio{% else %}/{% endif %}" class="nav-brand-link" title="Ir al inicio">
            <img src="/static/img/logo_gia_transparente.png" alt="GIA" class="nav-logo-large">
        </a>
    </div>

    <div class="nav-user-zone">
        <div class="darkmode-switch-wrapper" title="Cambiar tema visual">
            <span class="switch-icon">☀️</span>
            <label class="theme-switch" for="checkbox-theme">
                <input type="checkbox" id="checkbox-theme" onclick="toggleDarkMode()" style="display:none;">
                <span class="slider round"></span>
            </label>
            <span class="switch-icon">🌙</span>
        </div>
    </div>
</nav>

<script>
    function toggleDarkMode() {
        const isChecked = document.getElementById('checkbox-theme').checked;
        if (isChecked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        }
    }

    (function () {
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            const cb = document.getElementById('checkbox-theme');
            if (cb) cb.checked = true;
        }
    })();
</script>
