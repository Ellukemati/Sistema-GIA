{% extends "base.html" %}

{% block title %}Panel de administración{% endblock %}

{% block content %}
<div class="contenedor" style="margin-top: var(--spacing-md);">
    <a href="/inicio" class="btn-volver">⬅ Volver al inicio</a>
    <h1>⚙️ Panel de Control</h1>
</div>

<div id="tablas-container" class="dashboard-container" hx-get="/admin/tablas/recargar" hx-trigger="every 10s"
    hx-vals='js:{tab_activo: sessionStorage.getItem("gia_admin_tab") || "0"}'>
    {% include "partials/admin_tablas.html" %}
</div>

<!-- Modal mapeado con las clases unificadas de base.css -->
<div id="modal-pdf" class="modal-overlay">
    <div class="modal-content">
        <span onclick="cerrarModal()" class="modal-close">&times;</span>
        <h3 style="margin-top: 5px; color: var(--color-text);">👁️ Previsualización del Comprobante de Reserva</h3>
        <iframe id="visor-pdf" src="" width="100%" height="92%"
            style="border: 1px solid var(--color-border); border-radius: var(--radius-sm);"></iframe>
    </div>
</div>

<script>
    function switchTab(index) {
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        document.querySelectorAll('.tab-content').forEach((content, i) => {
            content.classList.toggle('active', i === index);
        });

        sessionStorage.setItem('gia_admin_tab', index);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const activeTab = sessionStorage.getItem('gia_admin_tab') || 0;
        switchTab(parseInt(activeTab));
    });

    document.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target.id === 'tablas-container') {
            const activeTab = sessionStorage.getItem('gia_admin_tab') || 0;
            switchTab(parseInt(activeTab));
        }
    });

    document.addEventListener("abrirComprobante", function (evt) {
        const idReserva = evt.detail.value;
        if (idReserva) {
            window.open(`/admin/historial-reservas/comprobante/${idReserva}`, '_blank');
        }
    });

    function abrirModalPrevisualizacion(idReserva) {
        const visor = document.getElementById("visor-pdf");
        visor.src = `/admin/reservas/previsualizar/${idReserva}#toolbar=0`;
        document.getElementById("modal-pdf").style.display = "block";
    }

    function cerrarModal() {
        document.getElementById("modal-pdf").style.display = "none";
        document.getElementById("visor-pdf").src = "";
    }

    window.onclick = function (event) {
        const modal = document.getElementById("modal-pdf");
        if (event.target == modal) {
            cerrarModal();
        }
    }
</script>
{% endblock %}
