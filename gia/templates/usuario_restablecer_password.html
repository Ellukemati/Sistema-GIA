{% extends "base.html" %}

{% block title %}GIA - Restablecer contraseña{% endblock %}

{% block extra_head %}
    {% include "estilos/auth.html" %}
{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <header class="auth-header">
            <p class="auth-brand">GIA</p>
            <h1>Nueva contraseña</h1>
            <p class="auth-subtitle">Establecer credenciales de acceso</p>
        </header>

        <form class="auth-form" hx-post="/restablecer-contrasena" hx-target="#resultado">
            <input type="hidden" name="token" value="{{ token }}">

            <div class="field">
                <label for="password">Nueva contraseña</label>
                <div class="password-wrapper">
                    <input 
                        id="password" 
                        type="password" 
                        name="password" 
                        required
                    >
                    <button type="button" id="btn-toggle" class="toggle-password" title="Mostrar/Ocultar contraseña">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="password_confirm">Repetir la contraseña nueva</label>
                <div class="password-wrapper">
                    <input 
                        id="password_confirm" 
                        type="password" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-primary">Actualizar Contraseña</button>
        </form>

        <footer class="auth-footer">
            <p><a href="/ingreso">Ir al Inicio de Sesión</a></p>
        </footer>

        <div id="resultado" style="margin-top: var(--spacing-md);"></div>
    </section>
</main>

<script>
    const inputPassword = document.getElementById('password');
    const inputConfirm = document.getElementById('password_confirm');

    function validarContrasenas() {
        if (inputPassword.value !== inputConfirm.value) {
            inputConfirm.setCustomValidity("Las contraseñas no coinciden");
        } else {
            inputConfirm.setCustomValidity("");
        }
    }

    inputPassword.addEventListener('change', validarContrasenas);
    inputConfirm.addEventListener('keyup', validarContrasenas);

    // Ojito del password
    document.getElementById('btn-toggle').addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();

        const iconoOjo = document.getElementById('eye-icon');
        
        if (inputPassword.type === 'password') {
            inputPassword.type = 'text';
            inputConfirm.type = 'password'; 
            
            iconoOjo.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            inputPassword.type = 'password';
            inputConfirm.type = 'password';
            
            iconoOjo.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    });
</script>
{% endblock %}
