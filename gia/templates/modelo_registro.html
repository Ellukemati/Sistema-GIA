{% extends "base.html" %}

{% block title %}Registro de modelos{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <a href="/inicio" class="btn-volver">⬅ Volver al inicio</a>
        <header class="auth-header">
            <div class="auth-brand">
                <img src="/static/img/logo_gia_transparente.png" alt="GIA" class="auth-logo">
            </div>
            <h1>Registro de modelo</h1>
            <p class="auth-subtitle">Alta de modelo de instrumento · FIUBA</p>
        </header>

        <form class="auth-form" hx-post="/modelo/registro" hx-target="#resultado" hx-encoding="multipart/form-data">
            <div class="field-row" style="grid-template-columns: 1fr 1fr;">
                <div class="field">
                    <label for="marca">Marca</label>
                    <input id="marca" type="text" name="marca" placeholder="Ej: Leica" required>
                </div>
                <div class="field">
                    <label for="nombre_modelo">Nombre del modelo</label>
                    <input id="nombre_modelo" type="text" name="nombre_modelo" placeholder="Ej: DM-500" required>
                </div>
            </div>

            <div class="field">
                <label for="categoria">Categoría</label>
                <input id="categoria" type="text" name="categoria" placeholder="Ej: Microscopio">
            </div>

            <div class="field">
                <label for="descripcion">Descripción</label>
                <input id="descripcion" type="text" name="descripcion" placeholder="Breve descripción del instrumento">
            </div>

            <div class="field-row" style="grid-template-columns: 1fr 1fr;">
                <div class="field">
                    <label for="manual_pdf">Archivo del Manual (PDF máx 16MB)</label>
                    <input id="manual_pdf" type="file" name="manual_pdf" accept="application/pdf">
                </div>
                <div class="field">
                    <label for="imagenes_modelo">Imágenes del modelo</label>
                    <input id="imagenes_modelo" type="file" name="imagenes[]" accept="image/png, image/jpeg" multiple>
                </div>
            </div>

            <button type="submit" class="btn-primary">Registrar modelo</button>
        </form>

        <footer class="auth-footer">
            <p><a href="/ejemplar/registro">Registrar un ejemplar</a></p>
        </footer>

        <div id="resultado">
            {% include "partials/resultado.html" %}
        </div>
    </section>
</main>
{% endblock %}
