{% extends "base.html" %}

{% block title %}Reserva finalizada{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <header class="auth-header">
            <div class="auth-brand">
                <img src="/static/img/logo_gia_transparente.png" alt="GIA" class="auth-logo">
            </div>
            <h1>{% if exito %}Reserva enviada{% else %}No se pudo finalizar{% endif %}</h1>
            <p class="auth-subtitle">Resultado de la solicitud de reserva</p>
        </header>

        <div class="reserva-finalizada-mensaje" style="margin-bottom: var(--spacing-lg);">
            <div class="mensaje {% if exito %}mensaje--exito{% else %}mensaje--error{% endif %}">
                <strong>{{ titulo }}</strong>
                <p>{{ mensaje }}</p>
            </div>
        </div>

        <div class="field-row" style="grid-template-columns: 1fr 1fr; gap: 15px;">
            <a href="/reservas" class="btn-primary" style="text-decoration: none; text-align: center;">Volver a
                reservas</a>
            <a href="/mis-reservas" class="btn-secondary">Mis reservas</a>
        </div>
    </section>
</main>
{% endblock %}
