<script>
    function validarDimensionesAvatar(input) {
        const archivo = input.files[0];
        if (!archivo) {
            input.setCustomValidity("");
            return;
        }

        const img = new Image();
        img.src = URL.createObjectURL(archivo);

        img.onload = function () {
            if (img.width !== img.height) {
                input.setCustomValidity("La imagen debe ser perfectamente cuadrada (Ej.: 400x400 píxeles).");
                input.reportValidity();
                input.value = "";
            } else {
                input.setCustomValidity("");
            }
        };
    }
</script>
