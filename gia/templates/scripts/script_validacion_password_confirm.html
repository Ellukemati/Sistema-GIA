<script>
    (function () {
        const inputPassword = document.getElementById('password');
        const inputConfirm = document.getElementById('password_confirm');
        const inputNombre = document.getElementById('nombre');
        const inputApellido = document.getElementById('apellido');

        function validarTextoLimpio(input) {
            if (!input) return;
            const tieneNumerosOSimbolos = /[0-9!@#$%^&*()_+=\[\]{};:"\\|,.<>\/?~`]/.test(input.value);

            if (tieneNumerosOSimbolos) {
                input.setCustomValidity("No se permiten números ni símbolos (salvo espacios, - o ')");
            } else {
                input.setCustomValidity("");
            }
        }

        function validarContrasenas() {
            if (!inputPassword || !inputConfirm) return;
            if (inputPassword.value !== inputConfirm.value) {
                inputConfirm.setCustomValidity("Las contraseñas no coinciden");
            } else {
                inputConfirm.setCustomValidity("");
            }
        }

        if (inputPassword && inputConfirm) {
            inputPassword.addEventListener('input', validarContrasenas);
            inputConfirm.addEventListener('input', validarContrasenas);
        }

        if (inputNombre) {
            inputNombre.addEventListener('input', () => validarTextoLimpio(inputNombre));
        }
        if (inputApellido) {
            inputApellido.addEventListener('input', () => validarTextoLimpio(inputApellido));
        }
    })();
</script>
